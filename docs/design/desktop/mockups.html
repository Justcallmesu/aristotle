<!doctype html>
<html lang="en" data-theme="light" data-density="comfortable" data-shell="2" data-w="960">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aristotle Server — desktop design board</title>
<style>
/* Fonts: the same faces as the Android app (docs/design.md §2). Atkinson Hyperlegible Next + Mono are OFL and
   ship as local files next to this board (fonts/); the Tauri app bundles them as woff2. Literata (titles) is NOT
   on this machine: the board falls back to the system serif, the app must bundle Literata variable woff2. */
@font-face{font-family:"Atkinson Hyperlegible Next";src:url("fonts/atkinson_next_regular.ttf");font-weight:400;font-display:block}
@font-face{font-family:"Atkinson Hyperlegible Next";src:url("fonts/atkinson_next_medium.ttf");font-weight:500;font-display:block}
@font-face{font-family:"Atkinson Hyperlegible Next";src:url("fonts/atkinson_next_semibold.ttf");font-weight:600 700;font-display:block}
@font-face{font-family:"Atkinson Hyperlegible Mono";src:url("fonts/atkinson_mono_regular.ttf");font-weight:400;font-display:block}
@font-face{font-family:"Atkinson Hyperlegible Mono";src:url("fonts/atkinson_mono_medium.ttf");font-weight:500;font-display:block}
@font-face{font-family:"Atkinson Hyperlegible Mono";src:url("fonts/atkinson_mono_semibold.ttf");font-weight:600 700;font-display:block}

/* ---------- tokens: palette A (docs/design.md §1) + three desktop-only additions (warn*, tray*) ---------- */
:root{
  --font-ui:"Atkinson Hyperlegible Next",sans-serif;
  --font-title:"Literata","Source Serif 4",Georgia,serif;
  --font-mono:"Atkinson Hyperlegible Mono",monospace;
  --r-xs:4px;--r-s:12px;--r-m:16px;--r-l:20px;--r-xl:28px;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;
  --ease-out:cubic-bezier(.05,.7,.1,1);--ease-in:cubic-bezier(.3,0,1,1);
}
:root[data-theme="light"]{
  color-scheme:light;
  --primary:#3B2E23;--on-primary:#F8F0E1;--primary-c:#E7D7BC;--on-primary-c:#2B2119;
  --secondary:#6E5843;--secondary-c:#EADCC6;--on-secondary-c:#2B2119;
  --tert:#2C6A5C;--on-tert:#FFFFFF;--tert-c:#BFE3D6;--on-tert-c:#0B2A23;
  --err:#B3261E;--on-err:#FFFFFF;--err-c:#F7D9D2;--on-err-c:#5A110A;
  --warn:#8A5300;--warn-c:#F4DFA8;--on-warn-c:#3B2600;
  --surface:#F5EEDF;--on-surface:#2B2119;--on-surface-v:#5C4B3C;
  --c-lowest:#FFFBF3;--c-low:#F0E7D5;--c:#EBE1CD;--c-high:#E5DAC4;--c-highest:#DFD3BB;
  --outline:#8A7763;--outline-v:#D3C4AA;
  --inverse:#3A3029;--on-inverse:#F5EEDF;--scrim:rgba(0,0,0,.32);
  --qr-ink:#2B2119;--qr-bg:#FFFBF3;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --primary:#E8D6B8;--on-primary:#2F241A;--primary-c:#4B3D30;--on-primary-c:#F3E4CA;
  --secondary:#D6C2A6;--secondary-c:#4A3C2E;--on-secondary-c:#F0E0C8;
  --tert:#8BD0BC;--on-tert:#00382D;--tert-c:#1C4F43;--on-tert-c:#A9EDD8;
  --err:#FFB4A9;--on-err:#690003;--err-c:#8C1D13;--on-err-c:#FFDAD4;
  --warn:#E8B04F;--warn-c:#4E3A12;--on-warn-c:#FBE2AE;
  --surface:#17130F;--on-surface:#EDE3D1;--on-surface-v:#CBBBA4;
  --c-lowest:#110E0B;--c-low:#1F1A15;--c:#231E19;--c-high:#2D2721;--c-highest:#38312A;
  --outline:#96846F;--outline-v:#4B4035;
  --inverse:#EDE3D1;--on-inverse:#2B2119;--scrim:rgba(0,0,0,.5);
  --qr-ink:#2B2119;--qr-bg:#FFFBF3;
}
:root[data-density="comfortable"]{--row:48px;--btn:36px;--pad:24px;--gap:16px}
:root[data-density="compact"]{--row:38px;--btn:32px;--pad:16px;--gap:12px}

*{box-sizing:border-box}
html{background:var(--surface);color:var(--on-surface)}
body{margin:0;font:400 14px/20px var(--font-ui);font-variant-numeric:normal;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.mono{font-family:var(--font-mono)}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- board chrome (not part of the app) ---------- */
.board{max-width:1500px;margin:0 auto;padding:0 32px 96px}
.tweaks{position:sticky;top:0;z-index:50;background:var(--c-low);border-bottom:1px solid var(--outline-v);padding:8px 32px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center}
.tweaks .grp{display:flex;align-items:center;gap:8px}
.tweaks .lbl{font-size:12px;line-height:16px;font-weight:600;color:var(--on-surface-v)}
.seg{display:inline-flex;border:1px solid var(--outline);border-radius:var(--r-s);overflow:hidden}
.seg button{background:transparent;border:0;border-right:1px solid var(--outline-v);padding:4px 12px;min-height:32px;cursor:pointer;font-size:13px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--secondary-c);color:var(--on-secondary-c);font-weight:600}
.seg button:hover{background:var(--c-high)}
.seg button[aria-pressed="true"]:hover{background:var(--secondary-c)}
h1.bt{font:500 28px/36px var(--font-title);margin:32px 0 4px}
.lede{max-width:78ch;color:var(--on-surface-v);margin:0 0 8px}
h2.bs{font:500 22px/28px var(--font-title);margin:56px 0 4px;padding-top:16px;border-top:1px solid var(--outline-v)}
h3.bh{font:600 12px/16px var(--font-ui);color:var(--on-surface-v);margin:24px 0 8px;letter-spacing:.02em}
.note{font-size:12px;line-height:16px;color:var(--on-surface-v);max-width:90ch;margin:4px 0 12px}
.stage{background:var(--c-lowest);border:1px solid var(--outline-v);border-radius:var(--r-m);padding:24px;overflow:auto;display:flex;justify-content:center}
.chips{display:flex;flex-wrap:wrap;gap:8px 16px;margin:12px 0 0;align-items:center}
.chips .lbl{font-size:12px;font-weight:600;color:var(--on-surface-v)}
.shells{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:start}
.shell-card{display:flex;flex-direction:column;gap:8px;min-width:0}
.shell-card .cap{font-size:13px;line-height:18px;max-width:46ch;min-height:108px}
.shell-card .cap b{font-weight:600}
.shell-card .frame-wrap{border:1px solid var(--outline-v);border-radius:var(--r-s);overflow:hidden;background:var(--c-lowest);padding:8px}
.shell-card.picked .frame-wrap{border-color:var(--primary);outline:2px solid var(--primary)}
.zoom-46{zoom:.46}
.zoom-58{zoom:.58}
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.gal figure{margin:0;min-width:0}
.gal figcaption{font-size:12px;line-height:16px;font-weight:600;color:var(--on-surface-v);margin:0 0 6px}
.gal figcaption span{font-weight:400}

/* ---------- window frame ---------- */
.win{width:var(--ww,960px);flex:none;background:var(--surface);color:var(--on-surface);border:1px solid var(--outline);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;position:relative;isolation:isolate}
.win.h{height:640px}
.deco{height:32px;flex:none;background:var(--c-high);display:flex;align-items:center;padding:0 10px;gap:8px;font-size:12px;line-height:16px;color:var(--on-surface-v);border-bottom:1px solid var(--outline-v);user-select:none}
.deco .ttl{flex:1;text-align:center;font-weight:600;color:var(--on-surface)}
.deco .wb{display:flex;gap:14px;font-size:13px;color:var(--on-surface-v);width:56px;justify-content:flex-end}
.deco .lbl-l{width:56px}
.appbody{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.appbody.sidebar{flex-direction:row}
.main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.content{flex:1;min-height:0;overflow:auto;padding:var(--pad);container-type:inline-size;container-name:ct;position:relative}
.win.h .content{overflow:auto}
.pane .content{overflow:visible}
.vh{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin:0 0 var(--gap)}
.vh h1{font:500 22px/28px var(--font-title);margin:0}
.vh p{margin:2px 0 0;color:var(--on-surface-v);max-width:62ch}
.vh .acts{display:flex;gap:8px;flex:none}

/* ---------- shell parts ---------- */
.tabs{display:flex;gap:2px;padding:0 var(--pad);border-bottom:1px solid var(--outline-v);background:var(--surface);flex:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:0 14px;height:44px;cursor:pointer;color:var(--on-surface-v);font-weight:500;display:inline-flex;align-items:center;gap:8px;margin-bottom:-1px}
.tabs button:hover{color:var(--on-surface);background:var(--c-low)}
.tabs button[aria-current="page"]{color:var(--on-surface);border-bottom-color:var(--primary);font-weight:600}
.side{width:196px;flex:none;background:var(--c-low);border-right:1px solid var(--outline-v);display:flex;flex-direction:column;padding:16px 8px 8px}
[data-w="720"] .side{width:168px}
.side .wm{font:600 18px/24px var(--font-title);padding:0 8px 0;margin:0}
.side .wm-sub{font-size:12px;line-height:16px;color:var(--on-surface-v);padding:0 8px 16px}
.side .sec{font-size:12px;line-height:16px;font-weight:600;color:var(--on-surface-v);padding:12px 8px 4px}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav button{background:none;border:0;text-align:left;padding:0 8px;height:36px;border-radius:var(--r-xs);cursor:pointer;display:flex;justify-content:space-between;align-items:center;color:var(--on-surface);font-weight:400}
.side nav button:hover{background:var(--c-high)}
.side nav button[aria-current="page"]{background:var(--secondary-c);color:var(--on-secondary-c);font-weight:600;border-radius:var(--r-s)}
.side nav .aux{font-size:12px;color:var(--on-surface-v);font-variant-numeric:tabular-nums}
.side nav button[aria-current="page"] .aux{color:var(--on-secondary-c)}
.side .foot{margin-top:auto;padding:12px 8px 4px;border-top:1px solid var(--outline-v);font-size:12px;line-height:16px;display:flex;flex-direction:column;gap:2px}
.side .foot b{font-weight:600;display:flex;align-items:center;gap:8px}
.side .foot span.d{color:var(--on-surface-v);padding-left:19px}
.band{flex:none;display:flex;align-items:center;gap:16px;padding:14px var(--pad);background:var(--c-low);border-bottom:1px solid var(--outline-v)}
.band .big{font:500 20px/26px var(--font-title);display:flex;align-items:center;gap:10px}
.band .sub{font-size:13px;line-height:18px;color:var(--on-surface-v)}
.band .grow{flex:1;min-width:0}
.band .acts{display:flex;gap:8px}

/* ---------- state light: shape + word, never colour alone ---------- */
.sl{display:inline-block;flex:none;vertical-align:-2px}
.sl.ok{color:var(--tert)}.sl.warn{color:var(--warn)}.sl.err{color:var(--err)}.sl.off{color:var(--on-surface-v)}

/* ---------- controls ---------- */
.btn{height:var(--btn);padding:0 16px;border-radius:12px;border:1px solid transparent;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;background:var(--c-high)}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.tonal{background:var(--secondary-c);color:var(--on-secondary-c)}
.btn.outline{background:transparent;border-color:var(--outline);color:var(--on-surface)}
.btn.outline.danger{color:var(--err);border-color:var(--err)}
.btn.danger-fill{background:var(--err);color:var(--on-err)}
.btn.text{background:transparent;padding:0 10px}
.btn.text.danger{color:var(--err)}
.btn.small{height:28px;padding:0 10px;font-size:13px;border-radius:8px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed;filter:none}
.field{height:var(--btn);border:1px solid var(--outline);border-radius:var(--r-s);background:var(--surface);padding:0 12px;min-width:0;font:inherit;color:inherit;width:100%}
.field::placeholder{color:var(--on-surface-v);opacity:1}
.fl{display:block;font-size:12px;line-height:16px;font-weight:600;color:var(--on-surface-v);margin:0 0 4px}
.sw{display:inline-flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;font-weight:500}
.sw .tr{width:40px;height:22px;border-radius:var(--r-s);border:2px solid var(--outline);position:relative;flex:none;background:var(--c-highest)}
.sw .tr::after{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:4px;background:var(--outline)}
.sw[aria-checked="true"] .tr{background:var(--primary);border-color:var(--primary)}
.sw[aria-checked="true"] .tr::after{left:21px;background:var(--on-primary)}
.sw[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.tag{display:inline-block;font-size:12px;line-height:16px;font-weight:600;padding:1px 6px;border-radius:var(--r-xs);background:var(--c-highest);color:var(--on-surface)}
.tag.err{background:var(--err-c);color:var(--on-err-c)}
.tag.warn{background:var(--warn-c);color:var(--on-warn-c)}
.tag.ok{background:var(--tert-c);color:var(--on-tert-c)}

/* grouped rows (design.md §3): 2 px apart, outer corners large, inner extraSmall */
.group{display:flex;flex-direction:column;gap:2px;margin:0 0 var(--gap)}
.group>.gh{font-size:12px;line-height:16px;font-weight:600;color:var(--on-surface-v);margin:4px 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.grow-row{background:var(--c-low);min-height:var(--row);padding:6px 16px;display:flex;align-items:center;gap:16px;border-radius:var(--r-xs)}
.group>.grow-row:nth-child(2){border-top-left-radius:var(--r-l);border-top-right-radius:var(--r-l)}
.group>.grow-row:last-child{border-bottom-left-radius:var(--r-l);border-bottom-right-radius:var(--r-l)}
.group>.gh+.grow-row:last-child{border-radius:var(--r-l)}
.grow-row .k{width:120px;flex:none;color:var(--on-surface-v)}
.group.lis .grow-row .k{width:84px}
.grow-row .v{flex:1;min-width:0;overflow-wrap:anywhere}
.grow-row .end{flex:none;display:flex;gap:8px;align-items:center}
.grow-row .sm{font-size:12px;line-height:16px;color:var(--on-surface-v)}
.grow-row.col{flex-direction:column;align-items:stretch;gap:2px;padding:10px 16px}

/* banners: Highest surface, onSurface text, no left rail */
.banner{background:var(--c-highest);color:var(--on-surface);border-radius:var(--r-m);padding:12px 16px;display:flex;gap:12px;align-items:flex-start;margin:0 0 var(--gap)}
.banner .bt2{font-weight:600}
.banner p{margin:0;color:var(--on-surface)}
.banner .acts{margin-left:auto;display:flex;gap:8px;flex:none}
.app-banner{margin:var(--pad) var(--pad) 0;flex:none}
.sheet-note{background:var(--c-highest);border-radius:var(--r-m);padding:12px 16px}
.codeblk{background:var(--c-highest);color:var(--on-surface);border-radius:var(--r-s);padding:10px 14px;font:400 13px/18px var(--font-mono);overflow-wrap:anywhere}
.err-line{background:var(--err-c);color:var(--on-err-c)}
.prog{height:4px;border-radius:2px;background:var(--c-highest);overflow:hidden}
.prog>i{display:block;height:100%;background:var(--tert);border-radius:2px}
.prog.ind>i{width:35%;animation:ind 1.4s var(--ease-out) infinite}
@keyframes ind{0%{margin-left:-35%}100%{margin-left:100%}}

/* dialogs: M3-style, extraLarge corners, tonal, scrim */
.scrim{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:20;padding:24px}
.dlg{background:var(--c-high);color:var(--on-surface);border-radius:var(--r-xl);padding:24px;width:min(440px,100%);box-shadow:0 8px 24px rgba(0,0,0,.28)}
.dlg h2{font:500 22px/28px var(--font-title);margin:0 0 12px}
.dlg p{margin:0 0 12px}
.dlg .warn-box{background:var(--err-c);color:var(--on-err-c);border-radius:var(--r-s);padding:10px 14px;margin:0 0 12px}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.pane{position:relative;border:1px solid var(--outline);border-radius:var(--r-s);overflow:hidden;background:var(--surface);color:var(--on-surface)}
.pane .scrim{position:absolute}

/* ---------- views ---------- */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--gap) 24px}
@container ct (max-width:600px){.two{grid-template-columns:minmax(0,1fr)}.grow-row .k{width:104px}.vh{flex-wrap:wrap}}
.qr-tile{background:var(--qr-bg);border-radius:var(--r-m);padding:12px;width:248px;height:248px;display:flex;align-items:center;justify-content:center;border:1px solid var(--outline-v)}
.qr-tile svg{display:block;width:100%;height:100%;shape-rendering:crispEdges}
.qr-tile.dead{background:var(--c-highest);border-style:dashed;border-color:var(--outline);flex-direction:column;gap:6px;text-align:left;align-items:flex-start;justify-content:flex-end;padding:16px}
.pairrow{display:flex;gap:24px;align-items:flex-start}
@container ct (max-width:600px){.qr-tile{width:208px;height:208px;padding:10px}.pairrow{gap:20px}.pairrow .cdw{width:208px!important}.code{font-size:24px;line-height:32px}}
@container ct (max-width:600px){.addr{flex-direction:column;gap:0}.addr .u{white-space:nowrap}}
@container ct (max-width:460px){.pairrow{flex-direction:column}}
.code{font:500 28px/36px var(--font-mono);letter-spacing:.04em}
.cd{font:600 14px/20px var(--font-ui);font-variant-numeric:tabular-nums}
.fp{display:grid;grid-template-columns:repeat(4,max-content);gap:2px 16px;font:500 14px/22px var(--font-mono)}
.fp-card{background:var(--c-low);border-radius:var(--r-m);padding:12px 16px}
.addr{display:flex;gap:12px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--outline-v)}
.addr:last-child{border-bottom:0}
.addr .u{font:400 13px/18px var(--font-mono);flex:1;min-width:0;overflow-wrap:anywhere}
.logbox{background:var(--c-highest);border-radius:var(--r-m);padding:8px 0;font:400 12.5px/18px var(--font-mono);color:var(--on-surface);height:340px;overflow:auto}
.pane .logbox{height:auto}
.logbox .ln{padding:1px 14px;display:block;padding-left:28px;text-indent:-14px}
.logbox.nowrap .ln{white-space:pre;text-indent:0;padding-left:14px}
.logbox .pre{color:var(--on-surface-v)}
.logbox .lvl{font-weight:600}
.logbar{display:flex;align-items:center;gap:20px;margin:0 0 10px;flex-wrap:wrap}
.live{font-weight:600;color:var(--tert);display:inline-flex;gap:6px;align-items:center}
.jump{padding-top:8px;position:sticky;bottom:8px;display:flex;justify-content:center;pointer-events:none}
.tbl{width:100%;border-collapse:separate;border-spacing:0 2px}
.tbl th{font-size:12px;line-height:16px;font-weight:600;color:var(--on-surface-v);text-align:left;padding:0 16px 4px}
.tbl td{background:var(--c-low);padding:8px 16px;height:var(--row);vertical-align:middle}
.tbl tr td:first-child{border-top-left-radius:var(--r-xs);border-bottom-left-radius:var(--r-xs)}
.tbl tr td:last-child{border-top-right-radius:var(--r-xs);border-bottom-right-radius:var(--r-xs)}
.tbl tbody tr:first-child td:first-child{border-top-left-radius:var(--r-l)}
.tbl tbody tr:first-child td:last-child{border-top-right-radius:var(--r-l)}
.tbl tbody tr:last-child td:first-child{border-bottom-left-radius:var(--r-l)}
.tbl tbody tr:last-child td:last-child{border-bottom-right-radius:var(--r-l)}
.tbl .sub{display:block;font-size:12px;line-height:16px;color:var(--on-surface-v)}
.tbl td.r{text-align:right;white-space:nowrap}
@container ct (max-width:600px){.tbl .hide-n{display:none}}
.empty{background:var(--c-low);border-radius:var(--r-l);padding:20px 24px;max-width:560px}
.empty h2{font:500 18px/24px var(--font-title);margin:0 0 4px}
.empty p{margin:0 0 14px;color:var(--on-surface-v)}
.hint{font-size:12px;line-height:16px;color:var(--on-surface-v)}
.srow{display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:var(--c-low);border-radius:var(--r-l);padding:14px 16px;margin:0 0 var(--gap)}
.srow .big{font:500 18px/24px var(--font-title)}
.srow .grow{flex:1;min-width:200px}

/* ---------- tray ---------- */
.panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.panel{border-radius:var(--r-s);padding:16px 20px;border:1px solid rgba(128,128,128,.35)}
.panel.pl{background:#EFF0F1;color:#232629;--tg:#1F7A5F;--ta:#B26A00;--tr:#C8261C;--ring:#EFF0F1}
.panel.pd{background:#31363B;color:#EFF0F1;--tg:#5FD1AE;--ta:#F2B33D;--tr:#FF6B5E;--ring:#31363B}
.panel h4{margin:0 0 10px;font:600 12px/16px var(--font-ui)}
.ti-grid{display:grid;grid-template-columns:auto repeat(4,auto) auto;gap:10px 22px;align-items:center;font-size:12px;line-height:16px}
.ti-grid .h{font-weight:600;opacity:.8}
.ti-grid .big{display:flex;gap:6px;align-items:center}
.ti{display:block}
.tg{color:var(--tg)}.ta{color:var(--ta)}.trd{color:var(--tr)}
.kmenu{width:260px;border-radius:6px;padding:4px;font:400 14px/20px var(--font-ui);box-shadow:0 4px 14px rgba(0,0,0,.3);border:1px solid rgba(128,128,128,.4)}
.kmenu.pl{background:#FCFCFC;color:#232629}
.kmenu.pd{background:#2A2E32;color:#EFF0F1}
.kmenu .mi{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:4px;min-height:28px}
.kmenu .mi.def{font-weight:700}
.kmenu .mi.hi.pl{background:#3DAEE9;color:#fff}
.kmenu .mi.hi.pd{background:#3DAEE9;color:#fff}
.kmenu .mi.dis{opacity:.45}
.kmenu .sep{height:1px;background:rgba(128,128,128,.35);margin:4px 6px}
.kmenu .ic{width:16px;height:16px;flex:none;opacity:.8}
.kmenu .sc{margin-left:auto;opacity:.6;font-size:12px}
.ttip{display:inline-block;border-radius:6px;padding:6px 10px;font-size:13px;line-height:18px;box-shadow:0 2px 8px rgba(0,0,0,.25);border:1px solid rgba(128,128,128,.4)}
.ttip.pl{background:#FCFCFC;color:#232629}.ttip.pd{background:#2A2E32;color:#EFF0F1}
.ttip b{display:block;font-weight:700}
.menus{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.mcol{display:flex;flex-direction:column;gap:8px}
.mcol .cap{font-size:12px;line-height:16px;font-weight:600;color:var(--on-surface-v)}

/* ---------- notifications (Plasma popup) ---------- */
.notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 24px}
.nrow{display:flex;flex-direction:column;gap:6px}
.nrow .cap{font-size:12px;line-height:16px;font-weight:600;color:var(--on-surface-v)}
.kn{width:380px;max-width:100%;border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:32px 1fr;gap:4px 12px;box-shadow:0 4px 14px rgba(0,0,0,.3);border:1px solid rgba(128,128,128,.4);font:400 14px/20px var(--font-ui)}
.kn.pl{background:#FCFCFC;color:#232629}.kn.pd{background:#2A2E32;color:#EFF0F1}
.kn .app{grid-column:1/3;font-size:12px;line-height:16px;opacity:.7;display:flex;justify-content:space-between}
.kn .t{font-weight:700}
.kn .b{opacity:.92}
.kn .btns{grid-column:2;display:flex;gap:8px;margin-top:6px}
.kn .kb{border:1px solid rgba(128,128,128,.55);border-radius:4px;padding:2px 12px;font-size:13px;line-height:20px;background:transparent}
.kn .icn{width:32px;height:32px;border-radius:6px;display:block}
.nsw{display:flex;gap:16px;flex-wrap:wrap}

.inert{pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pane .app-banner{margin:0 0 var(--gap)}
@media (max-width:1100px){.shells,.gal,.panels,.notes{grid-template-columns:1fr}}
</style>

/* ---------- state ---------- */
const K = {theme:'light', lang:'en', shell:'2', density:'comfortable', w:'960', wrap:true};
const LIVE = {view:'status', world:'ok', vs:{service:'idle', logs:'follow', pair:'idle', devices:'list', terminal:'off'}, dialog:null, pairAt:null};
const STORE = 'aristotle-desktop-board-v1';

/* ---------- helpers ---------- */
const t = (k, v) => {
  let s = (I18N[K.lang][k] ?? I18N.en[k] ?? ('«' + k + '»'));
  if (v) for (const [a, b] of Object.entries(v)) s = s.replaceAll('{' + a + '}', b);
  return s;
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2 = n => String(n).padStart(2, '0');
const local = ms => new Date(ms + TZ);
const hhmm = ms => { const d = local(ms); return p2(d.getUTCHours()) + ':' + p2(d.getUTCMinutes()); };
const MON = {en:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], id:['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des']};
const dmy = ms => { const d = local(ms); return K.lang === 'id' ? d.getUTCDate() + ' ' + MON.id[d.getUTCMonth()] : MON.en[d.getUTCMonth()] + ' ' + d.getUTCDate(); };
const sameDay = (a, b) => local(a).getUTCDate() === local(b).getUTCDate() && local(a).getUTCMonth() === local(b).getUTCMonth();
function seen(iso) {
  const ms = Date.parse(iso), diff = Math.round((NOW - ms) / 60000);
  if (diff < 1) return t('now');
  if (diff < 60) return t('ago_min', {n: diff});
  if (sameDay(ms, NOW)) return t('today', {t: hhmm(ms)});
  return dmy(ms) + ' ' + hhmm(ms);
}
const worldOf = w => WORLDS[w];
const serverUp = w => WORLDS[w].status.server === 'running';
const tone = w => {
  const s = WORLDS[w].status;
  if (s.server !== 'running') return 'err';
  return s.result.hermes && s.result.hermes.state === 'reachable' ? 'ok' : 'warn';
};
const mismatch = w => WORLDS[w].proto !== APP_PROTO;
const hermesOf = w => (WORLDS[w].status.result || {}).hermes;
const deviceName = id => (DEVICES.devices.find(d => d.id === id) || {}).name;

/* state light: shape + colour + (always) a word beside it */
function light(tn, px = 12) {
  const shape = {ok:'<circle cx="6" cy="6" r="5"/>', warn:'<path d="M6 .8 11.4 10.6H.6Z"/>', err:'<rect x=".8" y=".8" width="10.4" height="10.4" rx="1.5"/>'}[tn];
  return `<svg class="sl ${tn}" width="${px}" height="${px}" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true">${shape}</svg>`;
}
function headline(w) {
  const s = WORLDS[w].status;
  if (s.enabled === 'not-found') return {tn:'err', title:t('st_notinst'), sub:t('sub_notinst')};
  if (s.server !== 'running') return {tn:'err', title:t('st_stopped'), sub:t('sub_stopped')};
  const h = s.result.hermes.state;
  return {tn:tone(w), title:t('st_running'), sub:t(h === 'reachable' ? 'sub_ok' : h === 'not-running' ? 'sub_herm' : 'sub_hermerr')};
}

/* ---------- QR encoder (byte mode, ECC L, versions 1-15). The app uses a QR library on pairing.Payload (P11);
   this encoder exists only so the board shows a real, scannable code for the fixture payload. ---------- */
const QR = (() => {
  const ECC_L = [-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22];
  const BLK_L = [-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6];
  const rawMods = v => { let r = (16*v+128)*v+64; if (v >= 2) { const n = Math.floor(v/7)+2; r -= (25*n-10)*n-55; if (v >= 7) r -= 36; } return r; };
  const dataCw = v => Math.floor(rawMods(v)/8) - ECC_L[v]*BLK_L[v];
  const gfMul = (x, y) => { let z = 0; for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; } return z; };
  const rsDiv = d => { const r = new Array(d).fill(0); r[d-1] = 1; let root = 1; for (let i = 0; i < d; i++) { for (let j = 0; j < d; j++) { r[j] = gfMul(r[j], root); if (j+1 < d) r[j] ^= r[j+1]; } root = gfMul(root, 2); } return r; };
  const rsRem = (data, div) => { const r = div.map(() => 0); for (const b of data) { const f = b ^ r.shift(); r.push(0); div.forEach((c, i) => { r[i] ^= gfMul(c, f); }); } return r; };
  function encode(text) {
    const bytes = Array.from(new TextEncoder().encode(text));
    let ver = 1;
    for (; ver <= 15; ver++) { const cc = ver < 10 ? 8 : 16; if (4 + cc + bytes.length*8 <= dataCw(ver)*8) break; }
    if (ver > 15) throw new Error('payload too long for this board encoder');
    const bits = []; const put = (v, n) => { for (let i = n-1; i >= 0; i--) bits.push((v >>> i) & 1); };
    put(4, 4); put(bytes.length, ver < 10 ? 8 : 16); bytes.forEach(b => put(b, 8));
    const cap = dataCw(ver)*8; put(0, Math.min(4, cap - bits.length)); while (bits.length % 8) bits.push(0);
    const data = []; for (let i = 0; i < bits.length; i += 8) data.push(parseInt(bits.slice(i, i+8).join(''), 2));
    for (let pad = 0xEC; data.length < dataCw(ver); pad ^= 0xEC ^ 0x11) data.push(pad);
    const nb = BLK_L[ver], eccLen = ECC_L[ver], raw = Math.floor(rawMods(ver)/8), nShort = nb - raw % nb, shortLen = Math.floor(raw/nb);
    const div = rsDiv(eccLen), blocks = []; let k = 0;
    for (let i = 0; i < nb; i++) { const d = data.slice(k, k + shortLen - eccLen + (i < nShort ? 0 : 1)); k += d.length; const e = rsRem(d, div); if (i < nShort) d.push(0); blocks.push(d.concat(e)); }
    const all = [];
    for (let i = 0; i < blocks[0].length; i++) blocks.forEach((b, j) => { if (i !== shortLen - eccLen || j >= nShort) all.push(b[i]); });
    const size = ver*4+17, M = Array.from({length:size}, () => new Array(size).fill(false)), F = Array.from({length:size}, () => new Array(size).fill(false));
    const setF = (x, y, v) => { M[y][x] = v; F[y][x] = true; };
    for (let i = 0; i < size; i++) { setF(6, i, i % 2 === 0); setF(i, 6, i % 2 === 0); }
    const finder = (cx, cy) => { for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) { const x = cx+dx, y = cy+dy; if (x >= 0 && x < size && y >= 0 && y < size) setF(x, y, Math.max(Math.abs(dx), Math.abs(dy)) !== 2 && Math.max(Math.abs(dx), Math.abs(dy)) !== 4); } };
    finder(3, 3); finder(size-4, 3); finder(3, size-4);
    const na = ver > 1 ? Math.floor(ver/7)+2 : 0, step = ver === 32 ? 26 : Math.ceil((ver*4+4)/(na*2-2))*2, pos = [];
    if (na) { pos.push(6); for (let p = size-7; pos.length < na; p -= step) pos.splice(1, 0, p); }
    pos.forEach((cx, i) => pos.forEach((cy, j) => { if ((i === 0 && j === 0) || (i === 0 && j === na-1) || (i === na-1 && j === 0)) return; for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) setF(cx+dx, cy+dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1); }));
    const fmt = mask => {
      const d = (1 << 3) | mask; let r = d; for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
      const b = ((d << 10) | r) ^ 0x5412, g = i => ((b >>> i) & 1) === 1;
      for (let i = 0; i <= 5; i++) setF(8, i, g(i)); setF(8, 7, g(6)); setF(8, 8, g(7)); setF(7, 8, g(8));
      for (let i = 9; i < 15; i++) setF(14-i, 8, g(i));
      for (let i = 0; i < 8; i++) setF(size-1-i, 8, g(i));
      for (let i = 8; i < 15; i++) setF(8, size-15+i, g(i));
      setF(8, size-8, true);
    };
    fmt(0);
    if (ver >= 7) { let r = ver; for (let i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11) * 0x1F25); const b = (ver << 12) | r; for (let i = 0; i < 18; i++) { const v = ((b >>> i) & 1) === 1, a = size-11 + i % 3, c = Math.floor(i/3); setF(a, c, v); setF(c, a, v); } }
    let bi = 0;
    for (let right = size-1; right >= 1; right -= 2) { if (right === 6) right = 5; for (let vert = 0; vert < size; vert++) for (let j = 0; j < 2; j++) { const x = right-j, up = ((right+1) & 2) === 0, y = up ? size-1-vert : vert; if (!F[y][x] && bi < all.length*8) { M[y][x] = ((all[bi >>> 3] >>> (7-(bi & 7))) & 1) === 1; bi++; } } }
    const MASKS = [(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
    const apply = m => { for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!F[y][x] && MASKS[m](x, y)) M[y][x] = !M[y][x]; };
    const penalty = () => {
      let p = 0; const lines = [];
      for (let y = 0; y < size; y++) { lines.push(M[y].map(Number).join('')); }
      for (let x = 0; x < size; x++) { lines.push(M.map(r => Number(r[x])).join('')); }
      for (const s of lines) { const runs = s.match(/0+|1+/g); runs.forEach(r => { if (r.length >= 5) p += r.length - 2; }); p += 40 * ((s.match(/(?=10111010000|00001011101)/g) || []).length); }
      for (let y = 0; y < size-1; y++) for (let x = 0; x < size-1; x++) if (M[y][x] === M[y][x+1] && M[y][x] === M[y+1][x] && M[y][x] === M[y+1][x+1]) p += 3;
      const dark = M.flat().filter(Boolean).length; p += Math.floor(Math.abs(dark*20 - size*size*10) / (size*size)) * 10;
      return p;
    };
    let best = 0, bestP = Infinity;
    for (let m = 0; m < 8; m++) { apply(m); fmt(m); const p = penalty(); if (p < bestP) { best = m; bestP = p; } apply(m); }
    apply(best); fmt(best);
    return M;
  }
  function svg(text) {
    const M = encode(text), n = M.length, q = 4; let d = '';
    for (let y = 0; y < n; y++) { let x = 0; while (x < n) { if (M[y][x]) { let e = x; while (e < n && M[y][e]) e++; d += `M${x+q} ${y+q}h${e-x}v1h${-(e-x)}z`; x = e; } else x++; } }
    return `<svg viewBox="0 0 ${n+2*q} ${n+2*q}" role="img" aria-label="QR"><rect width="${n+2*q}" height="${n+2*q}" fill="var(--qr-bg)"/><path d="${d}" fill="var(--qr-ink)"/></svg>`;
  }
  return {encode, svg};
})();

/* ---------- part 3: components and views ---------- */
const tl = (lang, k, v) => { const o = K.lang; K.lang = lang; try { return t(k, v); } finally { K.lang = o; } };
const VIEWS = ['status', 'service', 'logs', 'pair', 'devices', 'terminal'];
const GROUPS = [['grp_server', ['status', 'service', 'logs']], ['grp_phones', ['pair', 'devices', 'terminal']]];

function btn(label, o = {}) {
  const a = o.act ? ` data-act="${o.act}"${o.arg != null ? ` data-arg="${esc(o.arg)}"` : ''} data-f="${o.act}:${o.arg ?? ''}"` : '';
  return `<button type="button" class="btn ${o.cls || ''}"${a}${o.dis ? ' disabled' : ''}${o.auto ? ' data-autofocus' : ''}>${label}</button>`;
}
function sw(on, label, o = {}) {
  const a = o.act ? ` data-act="${o.act}"${o.arg != null ? ` data-arg="${o.arg}"` : ''} data-f="${o.act}:${o.arg ?? ''}"` : '';
  return `<button type="button" class="sw" role="switch" aria-checked="${on}"${o.dis ? ' aria-disabled="true"' : ''}${a}><span class="tr"></span><span>${label}</span></button>`;
}
const vh = (title, sub, acts = '') => `<div class="vh"><div><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ''}</div>${acts ? `<div class="acts">${acts}</div>` : ''}</div>`;
const row = (k, v, end = '') => `<div class="grow-row"><span class="k">${k}</span><span class="v">${v}</span>${end ? `<span class="end">${end}</span>` : ''}</div>`;
const rowc = (k, v, end = '') => `<div class="grow-row col"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span style="color:var(--on-surface-v)">${k}</span>${end}</div><span>${v}</span></div>`;
const rowx = (title, sub, end = '') => `<div class="grow-row"><span class="v"><b style="font-weight:600">${title}</b><div class="sm">${sub}</div></span>${end ? `<span class="end">${end}</span>` : ''}</div>`;
const grp = (title, rows, aux = '', cls = '') => `<div class="group ${cls}"><div class="gh"><span>${title}</span>${aux}</div>${rows}</div>`;

function needsServer(o) {
  const can = WORLDS[o.world].status.enabled !== 'not-found' && !mismatch(o.world);
  return `<div class="empty"><h2>${t('needs_title')}</h2><p>${t('needs_body')}</p>${can ? btn(t('b_start'), {cls:'primary', act:'start'}) : ''}</div>`;
}

/* ---- Status ---- */
function vStatus(o) {
  const w = o.world, s = WORLDS[w].status, h = headline(w), up = serverUp(w), r = s.result || {};
  const notinst = s.enabled === 'not-found';
  const act = !up && !notinst && !mismatch(w) ? btn(t('b_start'), {cls:'primary', act:'start'}) : '';
  const head = o.noHead ? '' : `<div class="srow"><div class="grow"><div class="big" style="display:flex;gap:10px;align-items:center">${light(h.tn, 14)}${h.title}</div><div class="hint" style="font-size:14px;line-height:20px;margin-top:2px">${h.sub}</div></div>${act}</div>`;
  const noteNotinst = notinst ? `<div class="group"><div class="gh">${t('install_cmd')}</div><div class="grow-row"><span class="v codeblk" style="padding:6px 10px">./install.sh</span><span class="end">${btn(t('copy'), {cls:'tonal small', act:'copy'})}</span></div></div>` : '';
  const hm = r.hermes;
  const hermesRow = hm ? row(t('k_hermes'), `<span style="display:inline-flex;gap:8px;align-items:center">${light(hm.state === 'reachable' ? 'ok' : 'warn')}${t('hs_' + hm.state)}</span>` + (hm.reason ? `<div class="sm mono" style="margin-top:2px">${esc(hm.reason)}</div>` : '')) : row(t('k_hermes'), `<span style="color:var(--on-surface-v)">${t('hs_none')}</span>`);
  const svcWord = t('svc_' + s.service) || s.service;
  const proto = WORLDS[w].proto;
  const ver = up ? `${esc(r.version)} <span class="sm">· ${t('protocol', {n: proto})}</span>` + (mismatch(w) ? ` <span class="tag err" style="margin-left:6px">${t('app_expects', {n: APP_PROTO})}</span>` : '') : '—';
  const server = grp(t('g_server'),
    row(t('k_service'), svcWord) +
    row(t('k_enabled'), t('en_' + s.enabled)) +
    row(t('k_version'), ver) +
    row(t('k_port'), up ? `<span class="mono tnum">${r.port}</span>` : '—') +
    hermesRow);
  const lis = up ? r.listeners.map(l => {
    const a = r.addresses.find(x => x.iface === l.iface) || {};
    return row(t('kind_' + l.kind), `<span class="mono" style="white-space:nowrap">${l.ip}:${r.port}</span><div class="sm mono" style="margin-top:2px">${l.iface}${l.subnet ? ' · ' + l.subnet : ''}${a.default_route ? ' · ' + t('default_route') : ''}</div>`);
  }).join('') : `<div class="grow-row"><span class="v" style="color:var(--on-surface-v)">${t('no_listen')}</span></div>`;
  const tk = o.termKey || 'on', term = (o.T || TERM)[tk], devs = o.devs || DEVICES.devices;
  const latest = devs.length ? [...devs].sort((a, b) => b.last_seen_at.localeCompare(a.last_seen_at))[0] : null;
  const phones = up ? grp(t('g_phones'),
    rowc(t('k_paired'), devs.length ? t('paired_summary', {n: devs.length, t: seen(latest.last_seen_at)}) : t('none_paired'), btn(t('open_devices'), {cls:'text small', act:'view', arg:'devices'})) +
    rowc(t('k_terminal'), term.enabled ? t('term_summary_on', {open: term.open.length, granted: term.granted.length}) : t('term_summary_off'), btn(t('open_terminal'), {cls:'text small', act:'view', arg:'terminal'}))) : '';
  return `<h1 class="sr">${t('nav_status')}</h1>` + head + noteNotinst + `<div class="two" style="align-items:start"><div>${server}</div><div>${grp(t('g_listen'), lis, '', 'lis')}${phones}</div></div>`;
}

/* ---- Service ---- */
function vService(o) {
  const w = o.world, s = WORLDS[w].status, up = serverUp(w), notinst = s.enabled === 'not-found', mm = mismatch(w);
  const working = o.vs === 'restarting' ? 'working_restart' : o.vs === 'stopping' ? 'working_stop' : null;
  const lock = notinst || mm || working;
  const reason = notinst ? 'dis_notinst' : mm ? 'dis_mismatch' : up ? 'dis_running' : 'dis_stopped';
  const h = headline(w);
  const buttons = `<div style="display:flex;gap:8px;flex-wrap:wrap">${btn(t('b_start'), {cls: up ? '' : 'primary', act:'start', dis: lock || up})}${btn(t('b_stop'), {cls:'outline danger', act:'ask', arg:'stop', dis: lock || !up})}${btn(t('b_restart'), {cls:'tonal', act:'ask', arg:'restart', dis: lock || !up})}</div>`;
  const prog = working ? `<div style="max-width:420px;margin:14px 0 0"><div class="prog ind" role="progressbar" aria-label="${t(working)}"><i></i></div><div class="hint" style="margin-top:6px">${t(working)}</div></div>` : '';
  return vh(t('svc_title'), t('svc_sub')) +
    `<div class="srow"><div class="grow"><div class="big" style="display:flex;gap:10px;align-items:center">${light(h.tn, 14)}${h.title}</div></div></div>` +
    grp(t('svc_state'),
      row(t('svc_unit'), '<span class="mono">aristotle-server.service</span> <span class="sm">· systemd --user</span>') +
      row(t('k_service'), t('svc_' + s.service)) + row(t('k_enabled'), t('en_' + s.enabled))) +
    buttons + prog + (working ? '' : `<p class="hint" style="margin:10px 0 0">${t(reason)}</p>`);
}

/* ---- Logs ---- */
function logLine(l) {
  const [tm, lv, msg, at] = l, cls = lv === 'ERROR' ? 'err-line' : lv === 'WARN' ? 'warn-line' : '';
  const q = /\s/.test(msg) ? `"${esc(msg)}"` : esc(msg);
  const style = lv === 'WARN' ? ' style="background:var(--warn-c);color:var(--on-warn-c)"' : '';
  return `<span class="ln ${cls}"${style}><span class="pre">Nov 18 ${tm} cachyos aristotle-server[2411]:</span> <span class="lvl">level=${lv}</span> msg=${q}${at ? ' ' + esc(at) : ''}</span>`;
}
function vLogs(o) {
  const stopped = !serverUp(o.world);
  let lines = LOG_LINES.slice(), hidden = 0;
  if (o.vs === 'paused') { hidden = 3; lines = lines.slice(0, lines.length - hidden); }
  if (stopped) lines.push(LOG_STOP);
  const following = o.vs !== 'paused' && !stopped;
  const status = stopped ? '' : following ? `<span class="live">${light('ok', 10)}${t('live')}</span>` : `<span class="hint" style="font-weight:600;color:var(--on-surface)">${t('paused', {n: hidden})}</span>`;
  const bar = `<div class="logbar">${sw(following, t('follow'), {act:'follow', dis: stopped})}${sw(K.wrap, t('wrap'), {act:'wrap'})}${status}</div>`;
  const jump = !following && !stopped ? `<div class="jump"><span style="pointer-events:auto">${btn(t('jump'), {cls:'primary small', act:'follow'})}</span></div>` : '';
  return vh(t('logs_title'), esc(t('logs_sub'))) + bar +
    `<div class="logbox${K.wrap ? '' : ' nowrap'}" tabindex="0" role="log" aria-label="${t('logs_title')}">${lines.map(logLine).join('')}${jump}</div>` +
    `<p class="hint" style="margin:8px 0 0">${stopped ? t('logs_stopped') + ' ' : ''}${t('cap_note', {n: LOG_CAP.toLocaleString(K.lang === 'id' ? 'id-ID' : 'en-US')})}</p>`;
}

/* ---- Pair ---- */
const mmss = s => p2(Math.floor(s / 60)) + ':' + p2(s % 60);
function vPair(o) {
  const w = o.world, mm = mismatch(w);
  if (!serverUp(w)) return vh(t('pair_title'), '') + needsServer(o);
  if (o.vs === 'idle') {
    return vh(t('pair_title'), t('pair_sub')) +
      `<div style="max-width:380px"><label class="fl" for="pn">${t('pair_name')}</label><input class="field" id="pn" placeholder="pixel" ${o.interactive ? '' : 'tabindex="-1"'}><div class="hint" style="margin:4px 0 16px">${t('pair_name_hint')}</div>${btn(t('pair_show'), {cls:'primary', act:'pairshow', dis: mm})}</div>`;
  }
  if (o.vs === 'nolisten') {
    return vh(t('pair_title'), '') +
      `<div class="two"><div><div class="qr-tile dead"><b style="font-weight:600">${t('pair_none_t')}</b></div></div><div><p style="margin:0 0 12px;max-width:52ch">${t('pair_none_b')}</p><div class="fl">${t('details')}</div><div class="codeblk" style="margin-bottom:16px">qr_error: ${esc(PAIR_NOLISTEN.qr_error)}</div>${btn(t('pair_try'), {cls:'primary', act:'pairshow', dis: mm})}</div></div>`;
  }
  const exp = o.vs === 'expired', remain = exp ? 0 : o.remain;
  const code = PAIR.code.slice(0, 4) + ' ' + PAIR.code.slice(4);
  const fp = PAIR.fingerprint.split(' ').map(g => `<span>${g}</span>`).join('');
  const addrs = PAIR.addresses.map(a => `<div class="addr"><span class="u">${esc(a.url)}</span><span class="sm hint">${t('kind_' + a.kind)} · ${a.iface}${a.default_route ? ' · ' + t('default_route') : ''}</span></div>`).join('');
  const tile = exp
    ? `<div class="qr-tile dead"><b style="font-weight:600">${t('pair_expired')}</b><span style="font-size:13px;line-height:18px">${t('pair_expired_b', {t: hhmm(Date.parse(PAIR.expires_at))})}</span></div>`
    : `<div class="qr-tile">${QR.svg(PAIR.qr_payload)}</div>`;
  const cd = exp ? '' : `<div class="cdw" style="width:248px;margin-top:10px"><div class="cd">${t('pair_expires', {t: mmss(remain)})}</div><div class="prog" style="margin-top:6px" role="progressbar" aria-valuemin="0" aria-valuemax="300" aria-valuenow="${remain}"><i style="width:${Math.round(remain / 3)}%"></i></div></div>`;
  const right = exp
    ? `<div style="max-width:420px"><div class="fl">${t('pair_addr')}</div>${addrs}<div style="margin-top:16px">${btn(t('pair_new'), {cls:'primary', act:'pairshow', dis: mm})}</div></div>`
    : `<div style="min-width:0;flex:1"><div class="fl">${t('pair_code')}</div><div style="display:flex;gap:12px;align-items:center;margin-bottom:4px"><span class="code" data-sensitive>${code}</span>${btn(t('copy'), {cls:'tonal small', act:'copy'})}</div><p class="hint" style="margin:0 0 16px">${t('pair_scan')}</p>
      <div class="fl">${t('pair_fp')}</div><div class="fp-card" style="margin-bottom:6px"><div class="fp">${fp}</div></div><p class="hint" style="margin:0 0 16px;max-width:52ch">${t('pair_fp_hint')}</p>
      <div class="fl">${t('pair_addr')}</div>${addrs}<div style="margin-top:16px">${btn(t('pair_new'), {cls:'outline', act:'pairshow', dis: mm})}</div></div>`;
  return vh(t('pair_title'), '') + `<div class="pairrow"><div style="flex:none">${tile}${cd}</div>${right}</div>`;
}

/* ---- Devices ---- */
function vDevices(o) {
  const w = o.world, mm = mismatch(w);
  if (!serverUp(w)) return vh(t('dev_title'), '') + needsServer(o);
  const devs = o.devs || DEVICES.devices, granted = new Set(((o.T || TERM).on.granted).map(g => g.id));
  if (!devs.length) return vh(t('dev_title'), t('dev_sub')) + `<div class="empty"><h2>${t('empty_dev_t')}</h2><p>${t('empty_dev_b')}</p>${btn(t('b_pair'), {cls:'primary', act:'view', arg:'pair'})}</div>`;
  const rows = devs.map(d => `<tr><td><b style="font-weight:600">${esc(d.name)}</b><span class="sub mono">${d.id}</span></td><td class="hide-n">${dmy(Date.parse(d.created_at))}</td><td title="${esc(d.last_seen_at)}">${seen(d.last_seen_at)}</td><td class="hide-n">${granted.has(d.id) ? `<span class="tag">${t('granted')}</span>` : '<span class="hint">—</span>'}</td><td class="r">${btn(t('revoke') + '…', {cls:'outline danger small', act:'ask', arg:'revoke:' + d.id, dis: mm})}</td></tr>`).join('');
  return vh(t('dev_title'), t('dev_sub'), btn(t('b_pair'), {cls:'tonal', act:'view', arg:'pair'})) +
    `<table class="tbl"><thead><tr><th>${t('c_name')}</th><th class="hide-n">${t('c_paired')}</th><th>${t('c_seen')}</th><th class="hide-n">${t('c_term')}</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}

/* ---- Terminal ---- */
function vTerminal(o) {
  const w = o.world, mm = mismatch(w);
  if (!serverUp(w)) return vh(t('t_title'), '') + needsServer(o);
  const key = o.vs, term = (o.T || TERM)[key], devs = o.devs || DEVICES.devices, prob = !!term.problem;
  const lock = mm || prob;
  const sub = vh(t('t_title'), t('t_sub'));
  const toggle = `<div class="srow"><div class="grow">${sw(term.enabled, term.enabled ? t('t_on') : t('t_off'), {act: term.enabled ? 'tdisable' : 'ask', arg: term.enabled ? null : 'd7enable', dis: lock})}<div class="hint" style="margin:6px 0 0 50px;font-size:14px;line-height:20px;color:var(--on-surface)">${t(term.enabled ? 't_on_d' : 't_off_d')}</div></div>${term.enabled ? '' : btn(t('t_turn_on'), {cls:'primary', act:'ask', arg:'d7enable', dis: lock})}</div>` +
    (term.enabled ? `<p class="hint" style="margin:-8px 0 var(--gap) 0">${t('t_off_hint')}</p>` : '');
  const probBanner = prob ? `<div class="banner" role="alert">${light('err', 14)}<div><div class="bt2">${t('t_prob_t')}</div><p>${t('t_prob_b')}</p><div class="codeblk" style="margin-top:8px">problem: ${esc(term.problem)}</div></div><div class="acts">${btn(t('t_check'), {cls:'tonal', act:'recheck'})}</div></div>` : '';
  const warnBanner = term.warning ? `<div class="banner" role="status">${light('warn', 14)}<div><div class="bt2">${t('t_warn_t')}</div><div class="codeblk" style="margin-top:6px">warning: ${esc(term.warning)}</div></div></div>` : '';
  if (prob) return sub + probBanner + toggle;
  const grantedIds = new Set(term.granted.map(g => g.id)), free = devs.filter(d => !grantedIds.has(d.id));
  const gRows = term.granted.length ? term.granted.map(g => rowx(g.name ? esc(g.name) : `<span style="color:var(--on-surface-v)">${t('t_gone')}</span>`, `<span class="mono">${g.id}</span>`, btn(t('t_remove'), {cls:'text small danger', act:'ungrant', arg:g.id, dis: mm}))).join('')
    : `<div class="grow-row"><span class="v" style="color:var(--on-surface-v)">${t('t_grants_empty')}</span></div>`;
  const addRow = free.length
    ? `<div class="grow-row"><label class="k" for="gsel" style="width:auto">${t('t_grant_to')}</label><span class="v"><select class="field" id="gsel" style="max-width:240px" ${o.interactive ? '' : 'tabindex="-1"'}>${free.map(d => `<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select></span><span class="end">${btn(t('t_grant'), {cls:'tonal small', act:'ask', arg:'d7grant', dis: mm})}</span></div>`
    : `<div class="grow-row"><span class="v hint">${t('t_grant_all')}</span></div>`;
  const grants = grp(t('t_grants'), gRows + (devs.length ? addRow : ''));
  let open = '';
  if (term.enabled) {
    const oRows = term.open.length ? term.open.map(x => { const ms = Date.parse(x.since), mins = Math.round((NOW - ms) / 60000);
      return rowx(esc(deviceName(x.device_id) || x.device_id), `${t('kind_' + x.listener)} · ${hhmm(ms)} · ${t('dur_min', {n: mins})} · ${t('c_pid')} ${x.pid}`, `<span class="mono sm">${x.id}</span>`); }).join('')
      : `<div class="grow-row"><span class="v" style="color:var(--on-surface-v)">${t('t_open_empty')}</span></div>`;
    open = grp(t('t_open'), oRows);
  }
  return sub + toggle + warnBanner + `<div class="two" style="align-items:start"><div>${grants}</div><div>${open}</div></div>`;
}

const RENDER = {status:vStatus, service:vService, logs:vLogs, pair:vPair, devices:vDevices, terminal:vTerminal};

/* ---- dialogs (Material-style, tonal, scrim; D7 has a red button and no “don't ask again”) ---- */
function dialog(o) {
  const d = o.dialog; if (!d) return '';
  const [type, arg] = d.split(':'), name = esc(deviceName(arg) || 'tablet');
  const cancel = btn(t('b_cancel'), {cls:'outline', act:'close', auto:true});
  const spec = {
    stop:      {title:t('d_stop_t'), body:`<p>${t('d_stop_b')}</p>`, ok:btn(t('b_stop'), {cls:'danger-fill', act:'confirm', arg:'stop'})},
    restart:   {title:t('d_restart_t'), body:`<p>${t('d_restart_b')}</p>`, ok:btn(t('b_restart'), {cls:'primary', act:'confirm', arg:'restart'})},
    revoke:    {title:t('d_revoke_t', {name}), body:`<p>${t('d_revoke_b')}</p>`, ok:btn(t('revoke'), {cls:'danger-fill', act:'confirm', arg:'revoke:' + arg})},
    d7enable:  {title:t('d7_enable_t'), body:`<div class="warn-box"><b style="font-weight:600">${t('d7_warn')}</b></div><p>${t('d7_nogrant')}</p>`, ok:btn(t('d7_enable_b'), {cls:'danger-fill', act:'confirm', arg:'d7enable'})},

/* ---------- shells ---------- */
function navBtn(o, v, aux = '') {
  return `<button type="button" data-act="view" data-arg="${v}" data-f="view:${v}"${o.view === v ? ' aria-current="page"' : ''}>${aux ? `<span>${t('nav_' + v)}</span><span class="aux">${aux}</span>` : t('nav_' + v)}</button>`;
}
function auxFor(o, v) {
  if (!serverUp(o.world)) return '';
  if (v === 'devices') return String((o.devs || DEVICES.devices).length);
  if (v === 'terminal') return ((o.T || TERM)[o.termKey || 'on']).enabled ? t('t_on') : t('t_off');

}
function mmBanner(o) {
  if (!mismatch(o.world)) return '';
  return `<div class="banner app-banner" role="alert">${light('warn', 14)}<div><div class="bt2">${t('mm_title')}</div><p>${t('mm_body', {srv: WORLDS[o.world].proto, app: APP_PROTO})}</p></div></div>`;
}
function windowFrame(o) {

  let body;
  if (shell === '1') {
    body = `<div class="appbody"><div class="tabs" role="navigation">${VIEWS.map(v => navBtn(o, v)).join('')}</div>${mmBanner(o)}${content}</div>`;
  } else if (shell === '2') {
    const nav = GROUPS.map(([g, vs]) => `<div class="sec">${t(g)}</div><nav>${vs.map(v => navBtn(o, v, auxFor(o, v))).join('')}</nav>`).join('');
    const foot = `<div class="foot"><b>${light(h.tn)}${h.title}</b><span class="d">${serverUp(o.world) ? esc(WORLDS[o.world].status.result.version) + ' · Hermes ' + t('hs_' + WORLDS[o.world].status.result.hermes.state).toLowerCase() : t('svc_' + WORLDS[o.world].status.service)}</span></div>`;
    body = `<div class="appbody sidebar"><aside class="side"><p class="wm">Aristotle</p><div class="wm-sub">Server</div>${nav}${foot}</aside><div class="main">${mmBanner(o)}${content}</div></div>`;
  } else {
    const up = serverUp(o.world), mm = mismatch(o.world), ni = WORLDS[o.world].status.enabled === 'not-found';
    const sub = up ? esc(WORLDS[o.world].status.result.version) + ' · ' + t('hs_' + WORLDS[o.world].status.result.hermes.state) : h.sub;
    const acts = ni ? '' : up ? btn(t('b_restart'), {cls:'tonal', act:'ask', arg:'restart', dis: mm}) + btn(t('b_stop'), {cls:'outline danger', act:'ask', arg:'stop', dis: mm}) : btn(t('b_start'), {cls:'primary', act:'start', dis: mm});
    body = `<div class="appbody"><div class="band"><div class="grow"><div class="big">${light(h.tn, 14)}${h.title}</div><div class="sub">${sub}</div></div><div class="acts">${acts}</div></div><div class="tabs" role="navigation">${VIEWS.map(v => navBtn(o, v)).join('')}</div>${mmBanner(o)}${content}</div>`;
  }
  return `<div class="win h" style="--ww:${o.w}px"${o.interactive ? ' id="livewin"' : ''}><div class="deco" aria-hidden="true"><span class="lbl-l"></span><span class="ttl">Aristotle Server</span><span class="wb"><span>–</span><span>□</span><span>×</span></span></div>${body}${dialog(o)}</div>`;
}
function paneFrame(o) {
  const inner = RENDER[o.view]({...o});
  return `<div class="pane inert"><div class="content">${mmBanner(o)}${inner}</div>${dialog(o)}</div>`;
}

  ['service', [['ok', 'idle', 'Running'], ['ok', 'idle', 'Stop confirm (D15)', 'stop'], ['ok', 'idle', 'Restart confirm (D15)', 'restart'], ['ok', 'restarting', 'Restarting'], ['stopped', 'idle', 'Stopped'], ['notinst', 'idle', 'Not installed']]],
  ['logs', [['ok', 'follow', 'Follow on'], ['ok', 'paused', 'Follow off, new lines waiting'], ['stopped', 'follow', 'Server stopped, journal ends']]],
  ['pair', [['ok', 'idle', 'Before a code exists'], ['ok', 'active', 'Code, QR, countdown 04:12'], ['ok', 'expired', 'Expired'], ['ok', 'nolisten', 'No listener (qr_error)'], ['stopped', 'idle', 'Server stopped']]],
  ['devices', [['ok', 'list', 'Two phones'], ['ok', 'empty', 'Empty', null, []], ['ok', 'list', 'Revoke confirm (D15)', 'revoke:dev_a1'], ['stopped', 'list', 'Server stopped']]],
  ['terminal', [['ok', 'off', 'Off'], ['ok', 'on', 'On · one grant · one open terminal'], ['ok', 'warn', 'On · saved with a warning'], ['ok', 'problem', 'Problem from terminal status'], ['ok', 'off', 'D7 full-access dialog (turn on)', 'd7enable'], ['ok', 'on', 'D7 full-access dialog (grant)', 'd7grant:dev_b2']]]
];
const SPECIAL = {empty: []};
function gallery() {
  return G.map(([view, items]) => `<h3 class="bh">${t('nav_' + view)}</h3><div class="gal">${items.map(([world, vs, label, dlg, devs]) => {
    const o = {view, world, vs: view === 'devices' ? vs : vs, dialog: dlg || null, interactive: false, remain: 252, termKey: 'on', devs: devs || undefined, T: TERM};
    return `<figure><figcaption>${label}</figcaption>${paneFrame(o)}</figure>`;
  }).join('')}</div>`).join('');
}

/* ---------- live frame ---------- */
function liveOpts() {
  const L = LIVE, remain = L.pairAt ? Math.max(0, 300 - Math.floor((Date.now() - L.pairAt) / 1000)) : 252;
  return {view:L.view, world:L.world, vs:L.vs[{status:'service', service:'service', logs:'logs', pair:'pair', devices:'devices', terminal:'terminal'}[L.view]], dialog:L.dialog, interactive:true, shell:K.shell, w:K.w, remain, termKey:L.vs.terminal, devs:L.devs, T:L.T};
}
const CHIPS = {
  status: null,
  service: [['idle', 'Idle'], ['@stop', 'Stop confirm'], ['@restart', 'Restart confirm'], ['restarting', 'Restarting…']],
  logs: [['follow', 'Follow on'], ['paused', 'Follow off']],
  pair: [['idle', 'Before a code'], ['active', 'Code + QR'], ['expired', 'Expired'], ['nolisten', 'No listener']],
  devices: [['list', 'Two phones'], ['empty', 'Empty'], ['@revoke:dev_a1', 'Revoke confirm']],
  terminal: [['off', 'Off'], ['fresh', 'On, nothing yet'], ['on', 'On, grant + open'], ['warn', 'On + warning'], ['problem', 'Problem'], ['@d7enable', 'Enable dialog'], ['@d7grant:dev_b2', 'Grant dialog']]
};
const WORLD_CHIPS = [['ok', 'Running · Hermes reachable'], ['herm', 'Hermes not running'], ['hermerr', 'Hermes no answer'], ['stopped', 'Stopped'], ['notinst', 'Not installed'], ['mismatch', 'Version mismatch']];
function chipRow(label, items, pressedFn, attr) {
  return `<div class="chips"><span class="lbl">${label}</span><div class="seg">${items.map(([v, l]) => `<button type="button" ${attr}="${v}" aria-pressed="${pressedFn(v)}">${l}</button>`).join('')}</div></div>`;
}
function liveSection() {
  const o = liveOpts(), key = {status:'service', service:'service', logs:'logs', pair:'pair', devices:'devices', terminal:'terminal'}[LIVE.view];
  const chips = CHIPS[LIVE.view];
  const pressed = v => v.startsWith('@') ? LIVE.dialog === v.slice(1) : (!LIVE.dialog && LIVE.vs[key] === v);
  return `<div class="stage" id="live">${windowFrame(o)}</div>` +
    chipRow('Server state', WORLD_CHIPS, v => LIVE.world === v, 'data-world') +
    (chips ? chipRow(t('nav_' + LIVE.view) + ' state', chips, pressed, 'data-vs') : '');
}
function shellsSection() {
  const names = [['1', 'Conservative', 'Tabs along the top', 'Six tabs, one row, status only on the Status tab. Closest to a Qt settings window; costs nothing to build; the stop button is two clicks away from any state.'],
    ['2', 'Strong fit · recommended', 'Grouped sidebar with a status footer', 'Views grouped as Server and Phones (how the user thinks about the job). The server state stays visible in the footer on every view, so a glance at any tab answers “is it up?”.'],
    ['3', 'Divergent', 'Status band above tabs', 'The server state and Restart / Stop live in a band that never scrolls away; the Status view loses its headline. Fastest to act, but it puts Stop on every screen and makes Status thin.']];
  const card = (id, nm, sub, why, w, z) => `<div class="shell-card${K.shell === id ? ' picked' : ''}"><div class="frame-wrap"><div class="inert" style="zoom:${z}">${windowFrame({shell:id, view:'status', world:'ok', vs:'idle', interactive:false, w, remain:252, termKey:'on', T:TERM})}</div></div></div>`;
  return `<div class="shells">${names.map(([id, nm, sub, why]) => `<div class="shell-card${K.shell === id ? ' picked' : ''}"><div class="cap"><b>${id} · ${nm}</b> — ${sub}.<br>${why}</div><div class="frame-wrap"><div class="inert" style="zoom:.42">${windowFrame({shell:id, view:'status', world:'ok', vs:'idle', interactive:false, w:960, remain:252, termKey:'on', T:TERM})}</div></div><div><button type="button" class="btn tonal small" data-shell-pick="${id}">Use in the live window</button></div></div>`).join('')}</div>
  <h3 class="bh">The same three at 720 px wide (Pair view, the tightest layout)</h3>
  <div class="shells">${['1', '2', '3'].map(id => `<div class="shell-card"><div class="frame-wrap"><div class="inert" style="zoom:.52">${windowFrame({shell:id, view:'pair', world:'ok', vs:'active', interactive:false, w:720, remain:252, termKey:'on', T:TERM})}</div></div></div>`).join('')}</div>`;
}

function boardHTML() {
  const only = new URLSearchParams(location.search).get('only');
  const sec = (id, html) => (!only || only === id) ? html : '';
  return `<div class="board">
  <h1 class="bt">Aristotle Server — desktop design board</h1>
  <p class="lede"><b>Surface: Operate / Monitor.</b> A small control panel for the <span class="mono">aristotle-server</span> service: read its state, then act on it (start, stop, pair a phone, revoke, switch the terminal). No hero, no tiles, no charts; every value on the board comes from the JSON shapes in <span class="mono">docs/protocol.md §22</span> or is marked as a sample. Palette A from <span class="mono">docs/design.md</span>. Draft for the user’s approval (DSD).</p>
  <p class="note">Use the bar on top: theme, language (all app strings exist in EN and ID), shell option, density, window width (960 / 720), wrap. The live window below is clickable: use the sidebar or tabs, the buttons, the dialogs, and the state chips under it. Board chrome is English only.</p>
  ${sec('live', `<h2 class="bs" id="live-h">1 · The window (live)</h2><p class="note">The title bar is drawn by KDE, not by the app (Tauri keeps native decorations). Content area = window minus 32 px.</p>${liveSection()}`)}
  ${sec('shells', `<h2 class="bs" id="shells-h">2 · Shell options (navigation only)</h2><p class="note">Only the shell differs; the six views are the same in all three. Pick one for the live window with the button or the Tweaks bar. Recommendation in <span class="mono">design-notes.md</span>.</p>${shellsSection()}`)}
  ${sec('gallery', `<h2 class="bs" id="gallery-h">3 · Every view, every state</h2><p class="note">Content area only (no shell), in the current theme, language and density. Dialogs are drawn over their pane. Switch theme or language above to see the other variants.</p>${gallery()}`)}
  ${sec('tray', `<h2 class="bs" id="tray-h">4 · Tray icon and menu (D4, D14, D17)</h2><p class="note">Icon = the app’s monochrome glyph (docs/design/icon) tinted by state, plus a badge in a different <i>shape</i> per state (circle / triangle / square), so state is never colour alone. Actual pixel sizes, plus the 16 px icon enlarged ×4 for inspection. The badge sits top right where the glyph has no ink.</p>${traySection()}<h3 class="bh">Right-click menu (D4) and tooltip, KDE style, current theme and language</h3>${menusSection()}<p class="note">“Stop server” opens the same confirm dialog as the Service view (D15), as a small window. “Quit” closes the tray only; the server keeps running (D1, D4).</p>`)}
  ${sec('notes', `<h2 class="bs" id="notes-h">5 · Notifications (D5, D7, P11)</h2><p class="note">As a Plasma notification popup shows them, current theme. No pairing code, QR payload or token appears in any of them (P11); names come from <span class="mono">devices list</span>. “Open” launches the window app.</p>${notifSection()}`)}
  </div>`;
}

/* ---------- render + interaction ---------- */
function applyRoot() {
  const r = document.documentElement;
  r.dataset.theme = K.theme; r.dataset.density = K.density; r.dataset.shell = K.shell; r.dataset.w = K.w; r.lang = K.lang;
  document.querySelectorAll('[data-tw]').forEach(b => { const [k, v] = b.dataset.tw.split(':'); b.setAttribute('aria-pressed', String(K[k] === v)); });
  const w = document.getElementById('wrapsw'); if (w) w.setAttribute('aria-checked', String(K.wrap));
}
function renderAll() {
  const fa = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.f : null;
  document.getElementById('app').innerHTML = boardHTML();
  applyRoot();
  if (fa) { const el = document.querySelector(`#live [data-f="${CSS.escape(fa)}"]`); if (el) el.focus({preventScroll:true}); }
  const af = document.querySelector('#live [data-autofocus]'); if (af && LIVE.dialog) af.focus({preventScroll:true});
}
function save() { try { localStorage.setItem(STORE, JSON.stringify(K)); } catch (e) {} }
let timer = null;
function pairTick() {
  if (timer) clearInterval(timer);
  timer = setInterval(() => {
    if (LIVE.vs.pair !== 'active' || !LIVE.pairAt) return;
    if (Date.now() - LIVE.pairAt >= 300000) { LIVE.vs.pair = 'expired'; LIVE.pairAt = null; }
    if (LIVE.view === 'pair' && !LIVE.dialog) renderAll();
  }, 1000);
}
function liveReset() {
  LIVE.devs = DEVICES.devices.map(d => ({...d}));
  LIVE.T = JSON.parse(JSON.stringify(TERM));
}
function act(a, arg) {
  const L = LIVE;
  switch (a) {
    case 'view': L.view = arg; L.dialog = null; break;
    case 'start': L.world = 'ok'; break;
    case 'ask': L.dialog = arg === 'd7grant' ? 'd7grant:' + ((document.getElementById('gsel') || {}).value || 'dev_b2') : arg; break;
    case 'close': L.dialog = null; break;
    case 'follow': L.vs.logs = L.vs.logs === 'follow' ? 'paused' : 'follow'; break;
    case 'wrap': K.wrap = !K.wrap; save(); break;
    case 'pairshow': L.vs.pair = 'active'; L.pairAt = Date.now(); break;
    case 'tdisable': L.vs.terminal = 'off'; break;
    case 'ungrant': { const k = L.vs.terminal; if (L.T[k]) L.T[k].granted = L.T[k].granted.filter(g => g.id !== arg); break; }
    case 'confirm': {
      const [what, id] = arg.split(':'); const dl = L.dialog || ''; L.dialog = null;
      if (what === 'stop') { L.vs.service = 'stopping'; renderAll(); setTimeout(() => { L.world = 'stopped'; L.vs.service = 'idle'; renderAll(); }, 1400); return; }
      if (what === 'restart') { L.vs.service = 'restarting'; renderAll(); setTimeout(() => { L.vs.service = 'idle'; renderAll(); }, 1800); return; }
      if (what === 'revoke') L.devs = L.devs.filter(d => d.id !== id);
      if (what === 'd7enable') L.vs.terminal = L.T.on.granted.length ? 'on' : 'fresh';
      if (what === 'd7grant') { const did = dl.split(':')[1] || 'dev_b2'; const k = L.vs.terminal; L.T[k].granted.push({id:did, name:deviceName(did)}); }
      break;
    }
  }
  renderAll();
}
function setVs(v) {
  const L = LIVE, key = {status:'service', service:'service', logs:'logs', pair:'pair', devices:'devices', terminal:'terminal'}[L.view];
  if (v.startsWith('@')) { L.dialog = v.slice(1); }
  else {
    L.dialog = null;
    if (L.view === 'devices') L.devs = v === 'empty' ? [] : DEVICES.devices.map(d => ({...d}));
    if (v === 'active') L.pairAt = Date.now() - 48000;
    L.vs[key] = v;
  }
  renderAll();
}
function trapKeys(e) {
  if (!LIVE.dialog) return;
  if (e.key === 'Escape') { LIVE.dialog = null; renderAll(); return; }
  if (e.key !== 'Tab') return;
  const f = [...document.querySelectorAll('#live .dlg button')]; if (!f.length) return;
  const i = f.indexOf(document.activeElement);
  if (e.shiftKey && i <= 0) { f[f.length - 1].focus(); e.preventDefault(); }
  else if (!e.shiftKey && (i === f.length - 1 || i === -1)) { f[0].focus(); e.preventDefault(); }
}
document.addEventListener('keydown', trapKeys);
document.addEventListener('click', e => {
  const tw = e.target.closest('[data-tw]');
  if (tw) { const [k, v] = tw.dataset.tw.split(':'); K[k] = v; save(); renderAll(); return; }
  const wc = e.target.closest('[data-world]'); if (wc) { LIVE.world = wc.dataset.world; LIVE.dialog = null; renderAll(); return; }
  const vc = e.target.closest('[data-vs]'); if (vc) { setVs(vc.dataset.vs); return; }
  const sp = e.target.closest('[data-shell-pick]'); if (sp) { K.shell = sp.dataset.shellPick; save(); renderAll(); document.getElementById('live-h').scrollIntoView(); return; }
  const live = e.target.closest('#live'); if (!live) return;
  const el = e.target.closest('[data-act]');
  if (el) {
    if (el.disabled || el.getAttribute('aria-disabled') === 'true') return;
    const a = el.dataset.act;
    if (a === 'copy' || a === 'recheck') { const old = el.textContent; el.textContent = a === 'copy' ? '✓' : '…'; setTimeout(() => { el.textContent = old; }, 1200); return; }
    act(a, el.dataset.arg); return;
  }
  if (e.target.matches('[data-scrim]')) { LIVE.dialog = null; renderAll(); }
});

function init() {
  try { Object.assign(K, JSON.parse(localStorage.getItem(STORE) || '{}')); } catch (e) {}
  const q = new URLSearchParams(location.search);
  ['theme', 'lang', 'shell', 'density', 'w'].forEach(k => { if (q.get(k)) K[k] = q.get(k); });
  if (q.get('wrap')) K.wrap = q.get('wrap') !== '0';
  liveReset();
  if (q.get('view') && VIEWS.includes(q.get('view'))) LIVE.view = q.get('view');
  if (q.get('world') && WORLDS[q.get('world')]) LIVE.world = q.get('world');
  const key = {status:'service', service:'service', logs:'logs', pair:'pair', devices:'devices', terminal:'terminal'}[LIVE.view];
  if (q.get('vs')) { if (key === 'devices' && q.get('vs') === 'empty') LIVE.devs = []; if (q.get('vs') === 'active') LIVE.pairAt = Date.now() - 48000; LIVE.vs[key] = q.get('vs'); }
  if (q.get('dlg')) LIVE.dialog = q.get('dlg');
  pairTick(); renderAll();
}
window.addEventListener('error', e => { document.title = 'ERR: ' + e.message; });
init();

</script>
</body>
</html>
