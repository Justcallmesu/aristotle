[versions]
agp = "9.4.1"
kotlin = "2.4.21"
composeBom = "2026.06.01"
activityCompose = "1.13.0"
# 2.11.x needs compileSdk 37 (not installed); 2.10.0 is the newest that builds against android-36.
lifecycle = "2.10.0"
# 5.5.x needs compileSdk 37 (okhttp-android AAR metadata); 5.4.0 is the newest that builds against android-36.
okhttp = "5.4.0"
kotlinxSerialization = "1.12.0"
# 0.42.0+ needs compileSdk 37 (AAR metadata minCompileSdk); 0.41.0 is the newest that builds against android-36.
markdownRenderer = "0.41.0"
junit = "4.13.2"
# Google code scanner (T08): Play services owns the camera UI, so the app needs no CAMERA permission.
codeScanner = "16.1.0"
# T19b: Termux terminal libraries (Apache-2.0 exception in termux-app LICENSE.md), JitPack build of tag v0.118.3.
termux = "v0.118.3"
# TS2 app lock: BiometricPrompt. 1.1.0 is the newest stable (1.2/1.4 are alpha). It needs a FragmentActivity; its own
# fragment dependency (1.2.5) predates activity 1.13, so the current fragment is pinned beside it.
biometric = "1.1.0"
fragment = "1.9.1"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-text-google-fonts = { module = "androidx.compose.ui:ui-text-google-fonts" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-tls = { module = "com.squareup.okhttp3:okhttp-tls", version.ref = "okhttp" }
okhttp-mockwebserver3 = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
markdown-renderer-m3 = { module = "com.mikepenz:multiplatform-markdown-renderer-m3", version.ref = "markdownRenderer" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
play-services-code-scanner = { module = "com.google.android.gms:play-services-code-scanner", version.ref = "codeScanner" }
termux-terminal-emulator = { module = "com.github.termux.termux-app:terminal-emulator", version.ref = "termux" }
termux-terminal-view = { module = "com.github.termux.termux-app:terminal-view", version.ref = "termux" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
