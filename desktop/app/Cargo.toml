[package]
name = "aristotle-desktop"
description = "Aristotle Server window app (Tauri): IPC over aristotle-core, React frontend in ../ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
name = "aristotle_desktop"
path = "src/lib.rs"

[[bin]]
name = "aristotle-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
aristotle-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "=2.12.6", features = [] }
tauri-plugin-single-instance = "2"
