[workspace]
resolver = "2"
members = ["core", "tray"]
# DS3w adds "app" (Tauri, aristotle-desktop). The tray must never depend on it.

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ksni = { version = "0.3.7", features = ["blocking"] }
notify-rust = "4.19.0"
